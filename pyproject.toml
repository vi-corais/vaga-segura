[project]
name = "vaga-segura"
version = "0.4.1"
description = "Cruza ofertas de emprego com dados públicos brasileiros para apontar indícios de golpe de falso emprego e, no extremo, de aliciamento para trabalho análogo à escravidão"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
